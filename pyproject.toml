[project]
name = "pluggy2duckdb"
version = "0.1.0"
description = "Pluggy API raw data ingestion and DuckDB silver Parquet transformation"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
]

[project.scripts]
pluggy-raw = "pluggy2duckdb.raw.cli:main"
pluggy-silver = "pluggy2duckdb.silver.cli:main"
pluggy-silver-transactions-clean = "pluggy2duckdb.silver_transactions_clean.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pluggy2duckdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
