# User-editable configuration to enable (true) or disable (false) fetching each GET endpoint.
# This file is ONLY changed by the user and is NEVER modified by Python code.
endpoints:
  # Item-scoped endpoints
  GET /items/{id}: true
  GET /items/{id}/resources: true
  GET /items/{id}/scr: false
  GET /consents: true
  GET /accounts: true
  GET /investments: true
  GET /identity: true
  GET /loans: false

  # Connector-scoped endpoint (resolved from item.connector.id)
  GET /connectors/{id}: true

  # Account-scoped endpoints (resolved for each account.id in /accounts)
  GET /accounts/{id}: false
  GET /accounts/{id}/statements: false
  GET /accounts/{id}/balance: false
  GET /v2/transactions: true
  GET /transactions: false
  GET /bills: true

  # Investment-scoped endpoints (resolved for each investment.id in /investments)
  GET /investments/{id}: false
  GET /investments/{id}/transactions: false

  # Sub-entity detail endpoints (resolved from parent list IDs)
  GET /consents/{id}: false
  GET /identity/{id}: false
  GET /loans/{id}: false
  GET /bills/{id}: false
  GET /transactions/{id}: false
  GET /merchants: false

  # Global GET endpoints
  GET /connectors: false
  GET /v2/items: false
  GET /categories: false
  GET /categories/{id}: false
  GET /categories/rules: false
  GET /webhooks: false
  GET /webhooks/{id}: false
  GET /payments/customers: false
  GET /payments/customers/{id}: false
  GET /payments/recipients: false
  GET /payments/recipients/{id}: false
  GET /payments/recipients/institutions: false
  GET /payments/recipients/institutions/{id}: false
  GET /payments/requests: false
  GET /payments/requests/{id}: false
  GET /payments/requests/{id}/schedules: false
  GET /payments/requests/{id}/automatic-pix/schedules: false
  GET /payments/requests/{requestId}/automatic-pix/schedules/{paymentId}: false
  GET /payments/intents: false
  GET /payments/intents/{id}: false
  GET /smart-transfers/preauthorizations: false
  GET /smart-transfers/preauthorizations/{id}: false
  GET /smart-transfers/preauthorizations/{id}/balance: false
  GET /smart-transfers/preauthorizations/{id}/payments: false
  GET /smart-transfers/payments/{id}: false
  GET /boletos/{id}: false
